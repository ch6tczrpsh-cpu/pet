<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff7ea">
<title>轻松熊桌面宠物</title>
<style>
:root{
  --bg1:#fff7ea;
  --bg2:#ffe9c9;
  --brown:#8a6a4f;
  --brown2:#b78a56;
  --amber:#eaa53d;
  --amber2:#f2c078;
  --ink:#5a4632;
  --ink2:#8a7560;
  --card:#fffdf7;
  --line:#eeddbb;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC",serif;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
  color:var(--ink);
  overflow:hidden;
  position:fixed;inset:0;
  user-select:none;
  -webkit-user-select:none;
}
/* ===== 背景装饰 ===== */
.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1px)}
.b1{width:150px;height:150px;top:12%;left:8%;animation:drift 9s ease-in-out infinite}
.b2{width:90px;height:90px;top:6%;right:14%;animation:drift 11s ease-in-out 1s infinite}
.b3{width:120px;height:120px;bottom:18%;left:16%;animation:drift 13s ease-in-out 2s infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

/* ===== 顶部栏：名字 + 心情 ===== */
.topbar{position:fixed;top:12px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;z-index:20}
.name-tag{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:14px;font-weight:600;color:var(--brown);
  box-shadow:0 2px 8px rgba(138,106,79,.12);cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.name-tag .paw{font-size:15px}
.mood{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;box-shadow:0 2px 8px rgba(138,106,79,.12)}
.mood-face{font-size:16px;transition:transform .3s}
.mood-bar{width:64px;height:8px;background:#f0e6d2;border-radius:99px;overflow:hidden}
.mood-fill{height:100%;width:80%;background:linear-gradient(90deg,var(--amber2),var(--amber));border-radius:99px;transition:width .5s ease}
.mood-num{font-size:12px;color:var(--ink2);min-width:22px;text-align:right}

/* ===== 提示条 ===== */
.tip{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:20;
  background:rgba(138,106,79,.12);color:var(--ink2);font-size:12px;padding:5px 14px;border-radius:99px;
  white-space:nowrap;opacity:1;transition:opacity .6s}
.tip.hide{opacity:0;pointer-events:none}

/* ===== 宠物 ===== */
.wrap{position:absolute;z-index:10;left:60%;top:52%;display:flex;flex-direction:column;align-items:center}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:#fff;border:2px solid var(--amber2);color:var(--ink);border-radius:16px;
  padding:9px 14px;font-size:14px;max-width:240px;text-align:center;line-height:1.4;
  box-shadow:0 4px 14px rgba(138,106,79,.18);margin-bottom:14px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;white-space:nowrap}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:8px solid transparent;border-top-color:#fff;border-top-width:10px}
.bubble.show{opacity:1}
.pet{position:relative;cursor:grab;touch-action:none;transition:transform .2s ease}
.pet:active{cursor:grabbing}
.pet img{display:block;height:min(300px,42vh);width:auto;
  filter:drop-shadow(0 10px 14px rgba(90,70,50,.22))}
.pet.drag{transform:scale(.94)}
.pet.sad img{filter:grayscale(.9) brightness(.92) drop-shadow(0 10px 14px rgba(90,70,50,.22))}
.shadow{width:min(180px,46vw);height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(138,106,79,.20),transparent 70%);
  margin-top:6px;animation:shadowpulse 3s ease-in-out infinite}
@keyframes shadowpulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.82);opacity:.55}}

/* 动画状态 */
.pet.idle{animation:idle 3s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pet.dance{animation:dance 1s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-10px) rotate(-6deg)}75%{transform:translateY(-6px) rotate(6deg)}}
.pet.eat{animation:eat .6s ease-in-out 3}
@keyframes eat{0%,100%{transform:scale(1)}50%{transform:scale(1.06,.94)}}
.pet.sleep{animation:sleep 3.4s ease-in-out infinite}
@keyframes sleep{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(3px) rotate(2deg)}}
.pet.happy{animation:happy .5s ease}
@keyframes happy{0%,100%{transform:scale(1)}30%{transform:scale(1.12) rotate(-3deg)}60%{transform:scale(.96)}}
.pet.walk{animation:walk 1.2s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(6px) rotate(-3deg)}75%{transform:translateX(-6px) rotate(3deg)}}

/* 特效 */
.fx{position:absolute;inset:0;pointer-events:none}
.fx span{position:absolute;left:50%;top:20%;font-size:22px;animation:floatUp 1.6s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-120px) scale(1.2)}}
.fx .fall{animation:fall 1s ease-in forwards}
@keyframes fall{0%{opacity:0;transform:translate(-50%,-60px) scale(.6)}40%{opacity:1}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.fx .note{font-size:20px;animation:floatUp 1.4s ease-out forwards}

/* ===== 底部托盘 ===== */
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;
  display:flex;gap:6px;background:rgba(255,253,247,.85);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 8px 24px rgba(138,106,79,.18)}
.btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;
  cursor:pointer;padding:8px 11px;border-radius:14px;color:var(--ink2);
  transition:background .15s,transform .1s;font-family:inherit}
.btn i{font-size:22px;font-style:normal;transition:transform .15s}
.btn em{font-style:normal;font-size:11px}
.btn:hover{background:rgba(234,165,61,.14)}
.btn:active{transform:scale(.86)}
.btn:active i{transform:scale(1.2)}
.btn.pop i{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-12deg)}100%{transform:scale(1)}}
.btn.active{background:rgba(234,165,61,.2);color:var(--brown)}

@media (max-width:480px){
  .dock{gap:2px;padding:7px 5px;bottom:8px}
  .btn{padding:7px 8px}
  .btn i{font-size:20px}
  .btn em{font-size:10px}
  .name-tag{font-size:13px}
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<header class="topbar">
  <div class="name-tag" id="nameTag" title="点我改名"><span class="paw">🐻</span><span id="nameText">松松</span></div>
  <div class="mood">
    <span class="mood-face" id="moodFace">😊</span>
    <div class="mood-bar"><div class="mood-fill" id="moodFill"></div></div>
    <span class="mood-num" id="moodNum">80</span>
  </div>
</header>

<div class="tip" id="tip">点我摸摸 · 按住拖动 · 下方按钮陪我玩</div>

<div class="wrap" id="wrap">
  <div class="bubble" id="bubble"><span id="bubbleText">你好呀~</span></div>
  <div class="pet idle" id="pet">
    <img id="petImg" alt="轻松熊">
    <div class="fx" id="fx"></div>
  </div>
  <div class="shadow"></div>
</div>

<nav class="dock" id="dock">
  <button class="btn" data-act="feed"><i>🍯</i><em>喂食</em></button>
  <button class="btn" data-act="view"><i>🔄</i><em>换视角</em></button>
  <button class="btn" data-act="sleep"><i>😴</i><em>睡觉</em></button>
  <button class="btn" data-act="dance"><i>💃</i><em>跳舞</em></button>
  <button class="btn" data-act="talk"><i>💬</i><em>说话</em></button>
  <button class="btn" data-act="home"><i>🏠</i><em>回家</em></button>
</nav>

  var VIEW_NAME=['视角一','视角二','视角三'];
  var PHRASES=[
    '今天也要加油呀~','背单词了吗？四级冲鸭！🦆','摸摸头，好运自然来~','学习累了就来找我玩呀',
    '相信自己，你可以的！','Every day is a new chance~','记得喝水，劳逸结合哦','抱抱～(っ´ω`)っ',
    '单词大冒险在等你哟','你笑起来一定很好看~','累了就休息一下，我在呢','Study hard, play hard!',
    '蜂蜜最棒啦～🍯','给我取个新名字吧！'
  ];
  var FOODS=['🍯','🍡','🍓','🍪','🧁','🍎','🍮'];
  var NOTES=['♪','♫','🎵','🎶'];

  var wrap=document.getElementById('wrap');
  var pet=document.getElementById('pet');
  var petImg=document.getElementById('petImg');
  var fx=document.getElementById('fx');
  var bubble=document.getElementById('bubble');
  var bubbleText=document.getElementById('bubbleText');
  var moodFill=document.getElementById('moodFill');
  var moodNum=document.getElementById('moodNum');
  var moodFace=document.getElementById('moodFace');
  var nameText=document.getElementById('nameText');
  var nameTag=document.getElementById('nameTag');
  var tip=document.getElementById('tip');
  var sleepBtn=null;

  var state={name:'松松',mood:80,view:0,x:0.6,y:0.52,lastSeen:Date.now()};
  var sleepTimer=null, bubbleTimer=null, viewIdx=0;

  /* ---------- 初始化 ---------- */
  function load(){
    try{
      var s=JSON.parse(localStorage.getItem(KEY));
      if(s) state=Object.assign(state,s);
    }catch(e){}
    var now=Date.now();
    if(state.lastSeen){
      var mins=(now-state.lastSeen)/60000;
      state.mood=Math.max(0,Math.round(state.mood-mins*0.1));
    }
    state.lastSeen=now;
    nameText.textContent=state.name;
    setView(state.view||0);
    renderMood();
    place(state.x,state.y,false);
  }
  function save(){
    state.lastSeen=Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  }

  /* ---------- 视角 ---------- */
  function setView(i){
    viewIdx=((i%VIEWS.length)+VIEWS.length)%VIEWS.length;
    state.view=viewIdx;
    petImg.src=VIEWS[viewIdx].src;
    save();
  }

  /* ---------- 位置 ---------- */
  function place(fxr,fyr,anim){
    var w=Math.max(60,wrap.offsetWidth);
    var h=Math.max(60,wrap.offsetHeight+40);
    var L=Math.max(8,Math.min(window.innerWidth-w-8,fxr*(window.innerWidth-w)));
    var T=Math.max(56,Math.min(window.innerHeight-h-70,fyr*(window.innerHeight-h)));
    wrap.style.transition=anim?'left .7s ease,top .7s ease':'none';
    wrap.style.left=L+'px';
    wrap.style.top=T+'px';
    state.x=(window.innerWidth-w>0)?L/(window.innerWidth-w):0.6;
    state.y=(window.innerHeight-h>0)?T/(window.innerHeight-h):0.5;
  }
  function goHome(){
    wake();place(0.6,0.52,true);save();
    setTimeout(function(){wrap.style.transition='none';},750);
  }

  /* ---------- 心情 ---------- */
  function renderMood(){
    moodFill.style.width=state.mood+'%';
    moodNum.textContent=state.mood;
    if(state.mood>=70){moodFace.textContent='😊';}
    else if(state.mood>=40){moodFace.textContent='🙂';}
    else{moodFace.textContent='😢';}
    if(state.mood<40){pet.classList.add('sad');}
    else{pet.classList.remove('sad');}
  }
  function setMood(d){
    state.mood=Math.max(0,Math.min(100,state.mood+d));
    renderMood();save();
  }

  /* ---------- 气泡说话 ---------- */
  function say(text,ms){
    bubbleText.textContent=text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer=setTimeout(function(){bubble.classList.remove('show');},ms||2600);
  }
  function randomOf(arr){return arr[Math.floor(Math.random()*arr.length)];}

  /* ---------- 特效 ---------- */
  function spawn(emoji,type){
    var s=document.createElement('span');
    s.textContent=emoji;
    if(type==='fall')s.className='fall';
    else if(type==='note')s.className='note';
    s.style.left=(40+Math.random()*20)+'%';
    fx.appendChild(s);
    setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},1700);
  }
  function hearts(n){
    var E=['💛','💕','✨','❤️','💖'];
    for(var i=0;i<n;i++){
      (function(i){setTimeout(function(){spawn(randomOf(E),'up');},i*120);})(i);
    }
  }

  /* ---------- 状态切换 ---------- */
  function clearAnim(){
    ['idle','dance','eat','sleep','happy','walk'].forEach(function(c){pet.classList.remove(c);});
  }
  function wake(){
    if(pet.classList.contains('sleep')){
      pet.classList.remove('sleep');
      if(sleepBtn){sleepBtn.classList.remove('active');sleepBtn.querySelector('i').textContent='😴';sleepBtn.querySelector('em').textContent='睡觉';}
      if(sleepTimer){clearInterval(sleepTimer);sleepTimer=null;}
      pet.classList.add('idle');
    }
  }

  /* ---------- 动作 ---------- */
  function actFeed(){
    wake();
    clearAnim();pet.classList.add('eat');
    spawn(randomOf(FOODS),'fall');
    setTimeout(function(){
      clearAnim();pet.classList.add('idle');
      setMood(15);
      hearts(3);
      say('好吃好吃～'+(state.mood>=90?' 超级满足！':' 再来一点！'),2000);
    },1900);
  }
  function actDance(){
    wake();
    clearAnim();pet.classList.add('dance');
    for(var i=0;i<5;i++){(function(i){setTimeout(function(){spawn(randomOf(NOTES),'note');},i*250);})(i);}
    setMood(4);
    say('啦啦啦～跳舞好开心！',2000);
    setTimeout(function(){clearAnim();pet.classList.add('idle');},2400);
  }
  function actTalk(){
    wake();
    say(randomOf(PHRASES),2800);
  }
  function actSleep(){
    if(pet.classList.contains('sleep')){wake();say('睡醒啦～元气满满！');return;}
    clearAnim();pet.classList.add('sleep');
    sleepBtn.classList.add('active');
    sleepBtn.querySelector('i').textContent='💤';
    sleepBtn.querySelector('em').textContent='起床';
    say('呼…呼…Zzz',2600);
    var n=0;
    sleepTimer=setInterval(function(){
      spawn('💤','up');
      n++;
      if(n%3===0)setMood(1);
    },1200);
  }
  function actPat(){
    wake();
    clearAnim();pet.classList.add('happy');
    setTimeout(function(){clearAnim();pet.classList.add('idle');},500);
    hearts(4);
    setMood(2);
    say(randomOf(PHRASES),2400);
  }
  function actView(){
    setView(viewIdx+1);
    say('换个角度～现在是'+VIEW_NAME[viewIdx],1800);
  }

  /* ---------- 拖动 & 点击 ---------- */
  var dragging=false,moved=false,sx=0,sy=0,bx=0,by=0;
  pet.addEventListener('pointerdown',function(e){
    dragging=true;moved=false;
    sx=e.clientX;sy=e.clientY;
    bx=wrap.offsetLeft;by=wrap.offsetTop;
    pet.classList.add('drag');
    try{pet.setPointerCapture(e.pointerId);}catch(err){}
  });
  pet.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    var w=wrap.offsetWidth,h=wrap.offsetHeight+40;
    var L=Math.max(8,Math.min(window.innerWidth-w-8,bx+dx));
    var T=Math.max(56,Math.min(window.innerHeight-h-70,by+dy));
    wrap.style.left=L+'px';
    wrap.style.top=T+'px';
  });
  function endDrag(e){
    if(!dragging)return;
    dragging=false;
    pet.classList.remove('drag');
    if(!moved){actPat();}else{place(state.x,state.y,false);save();}
  }
  pet.addEventListener('pointerup',endDrag);
  pet.addEventListener('pointercancel',endDrag);

  /* ---------- 改名 ---------- */
  nameTag.addEventListener('click',function(){
    var n=prompt('给我的宠物起个名字吧～',state.name);
    if(n&&n.trim()){state.name=n.trim().slice(0,8);nameText.textContent=state.name;save();say('我叫'+state.name+'啦～');}
  });

  /* ---------- 按钮 ---------- */
  var acts={feed:actFeed,sleep:actSleep,dance:actDance,talk:actTalk,home:goHome,view:actView};
  document.querySelectorAll('.btn').forEach(function(b){
    if(b.dataset.act==='sleep')sleepBtn=b;
    b.addEventListener('click',function(){
      b.classList.add('pop');
      setTimeout(function(){b.classList.remove('pop');},360);
      acts[b.dataset.act]();
    });
  });

  /* ---------- 提示自动隐藏 ---------- */
  setTimeout(function(){tip.classList.add('hide');},7000);
  var first=!localStorage.getItem(KEY);
  if(first){setTimeout(function(){say('你好呀，我是'+state.name+'～ 我还会换视角哦，点「换视角」试试！',4400);},600);}

  /* ---------- 离开保存 & 定时保存 ---------- */
  window.addEventListener('beforeunload',save);
  setInterval(save,15000);

  load();
})();
</script>
</body>
</html>
