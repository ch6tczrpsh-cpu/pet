<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff7ea">
<title>轻松熊桌面宠物</title>
<style>
:root{
  --bg1:#fff7ea;
  --bg2:#ffe9c9;
  --brown:#8a6a4f;
  --brown2:#b78a56;
  --amber:#eaa53d;
  --amber2:#f2c078;
  --ink:#5a4632;
  --ink2:#8a7560;
  --card:#fffdf7;
  --line:#eeddbb;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC",serif;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
  color:var(--ink);
  overflow:hidden;
  position:fixed;inset:0;
  user-select:none;
  -webkit-user-select:none;
}
/* ===== 背景装饰 ===== */
.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1px)}
.b1{width:150px;height:150px;top:12%;left:8%;animation:drift 9s ease-in-out infinite}
.b2{width:90px;height:90px;top:6%;right:14%;animation:drift 11s ease-in-out 1s infinite}
.b3{width:120px;height:120px;bottom:18%;left:16%;animation:drift 13s ease-in-out 2s infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

/* ===== 顶部栏 ===== */
.topbar{position:fixed;top:12px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;z-index:20}
.name-tag{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:14px;font-weight:600;color:var(--brown);
  box-shadow:0 2px 8px rgba(138,106,79,.12);cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.name-tag .paw{font-size:15px}
.mood-wrap{display:flex;align-items:center;gap:8px}
.snd{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;
  box-shadow:0 2px 8px rgba(138,106,79,.12);transition:transform .1s}
.snd:active{transform:scale(.85)}
.mood{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;box-shadow:0 2px 8px rgba(138,106,79,.12)}
.mood-face{font-size:16px}
.mood-bar{width:64px;height:8px;background:#f0e6d2;border-radius:99px;overflow:hidden}
.mood-fill{height:100%;width:80%;background:linear-gradient(90deg,var(--amber2),var(--amber));border-radius:99px;transition:width .5s ease}
.mood-num{font-size:12px;color:var(--ink2);min-width:22px;text-align:right}

/* ===== 提示条 ===== */
.tip{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:20;
  background:rgba(138,106,79,.12);color:var(--ink2);font-size:12px;padding:5px 14px;border-radius:99px;
  white-space:nowrap;opacity:1;transition:opacity .6s}
.tip.hide{opacity:0;pointer-events:none}

/* ===== 宠物 ===== */
.wrap{position:absolute;z-index:10;left:60%;top:52%;display:flex;flex-direction:column;align-items:center}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:#fff;border:2px solid var(--amber2);color:var(--ink);border-radius:16px;
  padding:9px 14px;font-size:14px;max-width:240px;text-align:center;line-height:1.4;
  box-shadow:0 4px 14px rgba(138,106,79,.18);margin-bottom:14px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;white-space:nowrap}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:8px solid transparent;border-top-color:#fff;border-top-width:10px}
.bubble.show{opacity:1}
.dream{position:absolute;bottom:96%;right:4%;width:42px;height:42px;border-radius:50%;
  background:#fff;border:2px solid var(--amber2);display:flex;align-items:center;justify-content:center;
  font-size:22px;opacity:0;pointer-events:none;transition:opacity .3s;
  box-shadow:0 4px 12px rgba(138,106,79,.2)}
.dream.show{opacity:1;animation:dreamfloat 2s ease-in-out infinite}
@keyframes dreamfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.pet{position:relative;cursor:grab;touch-action:none;transition:transform .2s ease}
.pet:active{cursor:grabbing}
.pet img{display:block;height:min(300px,42vh);width:auto;
  filter:drop-shadow(0 10px 14px rgba(90,70,50,.22));
  transition:opacity .18s ease,transform .25s ease}
.pet.drag{transform:scale(.94)}
.pet.sad img{filter:grayscale(.9) brightness(.92) drop-shadow(0 10px 14px rgba(90,70,50,.22))}
.pet.flip img{transform:scaleX(-1)}
.pet.angry{animation:angry .38s ease-in-out infinite}
.pet.angry img{filter:drop-shadow(0 10px 14px rgba(180,40,40,.38)) hue-rotate(-20deg) saturate(1.8)}
@keyframes angry{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}}
.shadow{width:min(180px,46vw);height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(138,106,79,.20),transparent 70%);
  margin-top:6px;animation:shadowpulse 3s ease-in-out infinite}
@keyframes shadowpulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.82);opacity:.55}}

/* ===== 动画状态 ===== */
.pet.idle{animation:idle 3s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pet.walk{animation:walk .9s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-3deg)}25%{transform:translateY(-6px) rotate(0)}50%{transform:translateY(0) rotate(3deg)}75%{transform:translateY(-6px) rotate(0)}}
.pet.dance{animation:dance 1s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-8deg)}75%{transform:translateY(-8px) rotate(8deg)}}
.pet.eat{animation:eat .6s ease-in-out 3}
@keyframes eat{0%,100%{transform:scale(1)}50%{transform:scale(1.06,.94)}}
.pet.sleep{animation:sleep 3.4s ease-in-out infinite}
@keyframes sleep{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(3px) rotate(2deg)}}
.pet.happy{animation:happy .5s ease}
@keyframes happy{0%,100%{transform:scale(1)}30%{transform:scale(1.12) rotate(-3deg)}60%{transform:scale(.96)}}
.pet.jump{animation:jump .9s ease-in-out}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(-6px) scale(.96,1.05)}45%{transform:translateY(-34px) scale(1.04,.95)}70%{transform:translateY(-8px) scale(.98,1.02)}85%{transform:translateY(0) scale(1.08,.9)}95%{transform:translateY(0) scale(1,1)}}
.pet.stretch{animation:stretch 2s ease-in-out}
@keyframes stretch{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.07,.92) rotate(-2deg)}60%{transform:scale(1,1.07) rotate(2deg)}}
.pet.look{animation:look 1.8s ease-in-out}
@keyframes look{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-6deg) translateY(-3px)}55%{transform:rotate(6deg) translateY(-3px)}}
.pet.spin{animation:spin 1.1s ease-in-out}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

/* ===== 特效 ===== */
.fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.fx span{position:absolute;left:50%;top:20%;font-size:22px;animation:floatUp 1.6s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-120px) scale(1.2)}}
.fx .fall{animation:fall 1s ease-in forwards}
@keyframes fall{0%{opacity:0;transform:translate(-50%,-60px) scale(.6)}40%{opacity:1}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.fx .note{font-size:20px;animation:floatUp 1.4s ease-out forwards}
.fx .dust{width:10px;height:10px;border-radius:50%;background:rgba(138,106,79,.4);font-size:0;
  top:auto;bottom:-4px;animation:dust .9s ease-out forwards}
@keyframes dust{0%{opacity:.6;transform:translate(-50%,0) scale(.5)}100%{opacity:0;transform:translate(-50%,16px) scale(1.4)}}

/* ===== 底部托盘 ===== */
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:94vw;
  background:rgba(255,253,247,.85);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 8px 24px rgba(138,106,79,.18)}
.btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;
  cursor:pointer;padding:8px 11px;border-radius:14px;color:var(--ink2);
  transition:background .15s,transform .1s;font-family:inherit}
.btn i{font-size:22px;font-style:normal;transition:transform .15s}
.btn em{font-style:normal;font-size:11px}
.btn:hover{background:rgba(234,165,61,.14)}
.btn:active{transform:scale(.86)}
.btn:active i{transform:scale(1.2)}
.btn.pop i{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-12deg)}100%{transform:scale(1)}}
.btn.active{background:rgba(234,165,61,.2);color:var(--brown)}

@media (max-width:480px){
  .dock{gap:2px;padding:7px 5px;bottom:8px}
  .btn{padding:7px 8px}
  .btn i{font-size:20px}
  .btn em{font-size:10px}
  .name-tag{font-size:13px}
  .mood-bar{width:52px}
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<header class="topbar">
  <div class="name-tag" id="nameTag" title="点我改名"><span class="paw">🐻</span><span id="nameText">松松</span></div>
  <div class="mood-wrap">
    <div class="snd" id="sndBtn" title="音效开关">🔊</div>
    <div class="mood">
      <span class="mood-face" id="moodFace">😊</span>
      <div class="mood-bar"><div class="mood-fill" id="moodFill"></div></div>
      <span class="mood-num" id="moodNum">80</span>
    </div>
  </div>
</header>

<div class="tip" id="tip">点我摸摸 · 连点我会转晕/生气 · 点地面走过去 · 右上🔊开关音效</div>

<div class="wrap" id="wrap">
  <div class="bubble" id="bubble"><span id="bubbleText">你好呀~</span></div>
  <div class="dream" id="dream">💤</div>
  <div class="pet idle" id="pet">
    <img id="petImg" alt="轻松熊">
    <div class="fx" id="fx"></div>
  </div>
  <div class="shadow"></div>
</div>

<nav class="dock" id="dock">
  <button class="btn" data-act="feed"><i>🍯</i><em>喂食</em></button>
  <button class="btn" data-act="walk"><i>🚶</i><em>散步</em></button>
  <button class="btn" data-act="view"><i>🔄</i><em>换视角</em></button>
  <button class="btn" data-act="sleep"><i>😴</i><em>睡觉</em></button>
  <button class="btn" data-act="dance"><i>💃</i><em>跳舞</em></button>
  <button class="btn" data-act="talk"><i>💬</i><em>说话</em></button>
  <button class="btn" data-act="home"><i>🏠</i><em>回家</em></button>
</nav>

  /* ---------- 音效 ---------- */
  var AC=null;
  function ensureAC(){
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C){try{AC=new C();}catch(e){}}}
    if(AC&&AC.state==='suspended')AC.resume();
  }
  function beep(freq,dur,type,vol,delay){
    if(!soundOn)return;ensureAC();if(!AC)return;
    var t=AC.currentTime+(delay||0);
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,vol||0.15),t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+dur+0.06);
  }
  function renderSnd(){sndBtn.textContent=soundOn?'🔊':'🔇';}
  sndBtn.addEventListener('click',function(){
    soundOn=!soundOn;renderSnd();
    try{localStorage.setItem('pet_sound',soundOn?'1':'0');}catch(e){}
    if(soundOn)beep(660,0.08,'sine',0.12);
  });
  renderSnd();
  document.addEventListener('pointerdown',function(){ensureAC();});

  /* ---------- 初始化 ---------- */
  function load(){
    try{var s=JSON.parse(localStorage.getItem(KEY));if(s)state=Object.assign(state,s);}catch(e){}
    var now=Date.now();
    if(state.lastSeen){var mins=(now-state.lastSeen)/60000;state.mood=Math.max(0,Math.round(state.mood-mins*0.1));}
    state.lastSeen=now;
    nameText.textContent=state.name;
    setView(state.view||0);
    renderMood();
    place(state.x,state.y,false);
  }
  function save(){
    state.lastSeen=Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  }

  /* ---------- 视角 ---------- */
  function setView(i){
    viewIdx=((i%VIEWS.length)+VIEWS.length)%VIEWS.length;
    state.view=viewIdx;
    petImg.style.opacity='0';
    setTimeout(function(){petImg.src=VIEWS[viewIdx].src;petImg.style.opacity='1';},150);
    save();
  }

  function clampPos(L,T){
    var w=wrap.offsetWidth, h=wrap.offsetHeight+40;
    L=Math.max(8,Math.min(window.innerWidth-w-8,L));
    T=Math.max(56,Math.min(window.innerHeight-h-70,T));
    return {L:L,T:T};
  }
  function place(fxr,fyr,anim){
    var w=Math.max(60,wrap.offsetWidth);
    var h=Math.max(60,wrap.offsetHeight+40);
    var L=Math.max(8,Math.min(window.innerWidth-w-8,fxr*(window.innerWidth-w)));
    var T=Math.max(56,Math.min(window.innerHeight-h-70,fyr*(window.innerHeight-h)));
    wrap.style.transition=anim?'left .7s ease,top .7s ease':'none';
    wrap.style.left=L+'px';wrap.style.top=T+'px';
    state.x=(window.innerWidth-w>0)?L/(window.innerWidth-w):0.6;
    state.y=(window.innerHeight-h>0)?T/(window.innerHeight-h):0.5;
  }
  function goHome(){wake();place(0.6,0.52,true);save();beep(400,0.15,'sine',0.08);beep(500,0.15,'sine',0.08,0.15);setTimeout(function(){wrap.style.transition='none';},750);}

  /* ---------- 心情 ---------- */
  function renderMood(){
    moodFill.style.width=state.mood+'%';moodNum.textContent=state.mood;
    if(state.mood>=70)moodFace.textContent='😊';
    else if(state.mood>=40)moodFace.textContent='🙂';
    else moodFace.textContent='😢';
    if(state.mood<40)pet.classList.add('sad');else pet.classList.remove('sad');
  }
  function setMood(d){state.mood=Math.max(0,Math.min(100,state.mood+d));renderMood();save();}

  /* ---------- 气泡 ---------- */
  function say(text,ms){bubbleText.textContent=text;bubble.classList.add('show');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(function(){bubble.classList.remove('show');},ms||2600);}
  function randomOf(a){return a[Math.floor(Math.random()*a.length)];}

  /* ---------- 特效 ---------- */
  function spawn(emoji,type){
    var s=document.createElement('span');s.textContent=emoji;
    if(type==='fall')s.className='fall';else if(type==='note')s.className='note';
    s.style.left=(40+Math.random()*20)+'%';
    fx.appendChild(s);
    setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},1700);
  }
  function spawnDust(){
    var d=document.createElement('span');d.className='dust';d.style.left=(30+Math.random()*40)+'%';
    fx.appendChild(d);
    setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},1000);
  }
  function hearts(n){
    var E=['💛','💕','✨','❤️','💖'];
    for(var i=0;i<n;i++){(function(i){setTimeout(function(){spawn(randomOf(E),'up');},i*120);})(i);}
  }

  /* ---------- 状态切换 ---------- */
  function clearAnim(){['idle','walk','dance','eat','sleep','happy','jump','stretch','look','spin','angry'].forEach(function(c){pet.classList.remove(c);});}
  function wake(){
    if(pet.classList.contains('sleep')){
      pet.classList.remove('sleep');stopDream();
      if(sleepBtn){sleepBtn.classList.remove('active');sleepBtn.querySelector('i').textContent='😴';sleepBtn.querySelector('em').textContent='睡觉';}
      if(sleepTimer){clearInterval(sleepTimer);sleepTimer=null;}
      pet.classList.add('idle');
    }
  }

  /* ---------- 梦境 ---------- */
  function startDream(){
    dream.textContent=DREAM[0];var di=0;
    dream.classList.add('show');
    dreamTimer=setInterval(function(){di=(di+1)%DREAM.length;dream.textContent=DREAM[di];},1500);
  }
  function stopDream(){dream.classList.remove('show');if(dreamTimer){clearInterval(dreamTimer);dreamTimer=null;}}

  /* ---------- 散步 ---------- */
  function walkTo(px,py){
    busy=true;
    var curL=wrap.offsetLeft;
    var pos=clampPos(px,py);
    var dir=(pos.L>=curL)?1:-1;
    setView(SIDE);
    if(dir<0)pet.classList.add('flip');else pet.classList.remove('flip');
    clearAnim();pet.classList.add('walk');
    wrap.style.transition='left 1.6s ease-in-out,top 1.6s ease-in-out';
    wrap.style.left=pos.L+'px';wrap.style.top=pos.T+'px';
    var dust=setInterval(function(){spawnDust();beep(170,0.035,'square',0.03);},300);
    setTimeout(function(){
      clearInterval(dust);
      wrap.style.transition='none';
      pet.classList.remove('flip');
      setView(FRONT);
      clearAnim();pet.classList.add('idle');
      busy=false;
      var w=wrap.offsetWidth,h=wrap.offsetHeight+40;
      state.x=(window.innerWidth-w>0)?pos.L/(window.innerWidth-w):0.6;
      state.y=(window.innerHeight-h>0)?pos.T/(window.innerHeight-h):0.5;
      save();
    },1600);
  }
  function actWalk(){
    if(busy)return;
    wake();
    var w=wrap.offsetWidth,h=wrap.offsetHeight+40;
    var tx=8+Math.random()*(window.innerWidth-w-16);
    var ty=56+Math.random()*(window.innerHeight-h-130);
    walkTo(tx,ty);
  }

  /* ---------- 其他动作 ---------- */
  function actFeed(){
    if(busy)return;
    wake();
    clearAnim();pet.classList.add('eat');
    spawn(randomOf(FOODS),'fall');
    beep(500,0.09,'square',0.1);beep(650,0.09,'square',0.1,0.12);beep(820,0.12,'square',0.1,0.24);
    setTimeout(function(){
      clearAnim();pet.classList.add('idle');
      setMood(15);hearts(3);
      say('好吃好吃～'+(state.mood>=90?' 超级满足！':' 再来一点！'),2000);
    },1900);
  }
  function actDance(){
    if(busy)return;
    wake();
    clearAnim();pet.classList.add('dance');
    for(var i=0;i<5;i++){(function(i){setTimeout(function(){spawn(randomOf(NOTES),'note');},i*250);})(i);}
    [523,659,784,659].forEach(function(f,i){beep(f,0.12,'triangle',0.08,i*0.15);});
    setMood(4);
    say('啦啦啦～转圈圈！',2000);
    var vi=viewIdx;
    var dv=setInterval(function(){vi=(vi+1)%3;setView(vi);},480);
    setTimeout(function(){
      clearInterval(dv);
      clearAnim();pet.classList.add('idle');
      setView(FRONT);
    },2400);
  }
  function actTalk(){wake();beep(880,0.05,'triangle',0.07);say(randomOf(PHRASES),2800);}
  function actSleep(){
    if(pet.classList.contains('sleep')){wake();say('睡醒啦～元气满满！');return;}
    clearAnim();pet.classList.add('sleep');
    beep(330,0.6,'sine',0.06);beep(262,0.8,'sine',0.05,0.4);
    sleepBtn.classList.add('active');
    sleepBtn.querySelector('i').textContent='💤';sleepBtn.querySelector('em').textContent='起床';
    say('呼…呼…Zzz',2600);
    startDream();
    var n=0;
    sleepTimer=setInterval(function(){
      if(n%3===0)spawn(randomOf(['💤','🌙','⭐']),'up');
      n++;if(n%3===0)setMood(1);
    },1200);
  }
  function actView(){
    wake();
    setView(viewIdx+1);
    clearAnim();pet.classList.add('spin');
    beep(300,0.3,'sawtooth',0.04);beep(180,0.3,'sawtooth',0.04,0.15);
    setTimeout(function(){clearAnim();pet.classList.add('idle');},1100);
    say('现在是'+VIEW_NAME[viewIdx]+'～',1600);
  }
  function actJump(){
    wake();
    clearAnim();pet.classList.add('jump');
    spawn('✨','up');
    beep(300,0.15,'sine',0.08);beep(520,0.12,'sine',0.08,0.12);
    setTimeout(function(){clearAnim();pet.classList.add('idle');},900);
  }
  function actStretch(){
    clearAnim();pet.classList.add('stretch');
    setTimeout(function(){clearAnim();pet.classList.add('idle');},2000);
  }
  function actLook(){
    clearAnim();pet.classList.add('look');
    beep(700,0.06,'triangle',0.05);
    say('嗯？你在做什么呀~',1800);
    setTimeout(function(){clearAnim();pet.classList.add('idle');},1800);
  }
  function actAutoTurn(){
    clearAnim();pet.classList.add('spin');
    beep(300,0.3,'sawtooth',0.04);
    var vi=viewIdx;
    var st=setInterval(function(){vi=(vi+1)%3;setView(vi);},350);
    setTimeout(function(){clearInterval(st);clearAnim();pet.classList.add('idle');setView(FRONT);},1200);
  }

  /* ---------- 摸头 / 连点 ---------- */
  function actPat(){
    wake();
    patCount++;clearTimeout(patReset);
    patReset=setTimeout(function(){patCount=0;},1500);
    if(patCount>=7){actAngry();return;}
    if(patCount>=4){actDizzy();return;}
    beep(420,0.06,'sine',0.1);
    clearAnim();pet.classList.add('happy');
    setTimeout(function(){clearAnim();pet.classList.add('idle');},500);
    hearts(4);setMood(2);
    say(randomOf(PHRASES),2400);
  }
  function actDizzy(){
    patCount=0;clearTimeout(patReset);
    clearAnim();pet.classList.add('spin');
    for(var i=0;i<4;i++){(function(i){setTimeout(function(){spawn('💫','up');},i*180);})(i);}
    beep(500,0.5,'sawtooth',0.06);
    say('哎呀…转晕啦～😵',2200);
    setTimeout(function(){clearAnim();pet.classList.add('idle');},1300);
  }
  function actAngry(){
    patCount=0;clearTimeout(patReset);
    clearAnim();pet.classList.add('angry');
    spawn('💢','up');setTimeout(function(){spawn('💢','up');},200);
    beep(120,0.3,'square',0.08);beep(100,0.3,'square',0.08,0.2);
    setMood(-2);
    say('哼！再点我真的生气啦！😤',2600);
    setTimeout(function(){clearAnim();pet.classList.add('idle');},2200);
  }

  /* ---------- 待机随机动作 ---------- */
  function scheduleIdle(){
    clearTimeout(idleTimer);
    idleTimer=setTimeout(function(){doIdle();scheduleIdle();},18000+Math.random()*22000);
  }
  function doIdle(){
    if(busy||pet.classList.contains('sleep'))return;
    var r=Math.random();
    if(r<0.28)actStretch();
    else if(r<0.5)actLook();
    else if(r<0.66)actJump();
    else if(r<0.86)actAutoTurn();
    else say(randomOf(PHRASES));
  }

  /* ---------- 拖动 & 点击 ---------- */
  var dragging=false,moved=false,sx=0,sy=0,bx=0,by=0;
  pet.addEventListener('pointerdown',function(e){
    dragging=true;moved=false;sx=e.clientX;sy=e.clientY;bx=wrap.offsetLeft;by=wrap.offsetTop;
    pet.classList.add('drag');
    try{pet.setPointerCapture(e.pointerId);}catch(err){}
  });
  pet.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    var p=clampPos(bx+dx,by+dy);
    wrap.style.left=p.L+'px';wrap.style.top=p.T+'px';
  });
  function endDrag(e){
    if(!dragging)return;
    dragging=false;pet.classList.remove('drag');
    if(!moved){actPat();}else{place(state.x,state.y,false);save();}
  }
  pet.addEventListener('pointerup',endDrag);
  pet.addEventListener('pointercancel',endDrag);

  /* ---------- 点地面走过去 ---------- */
  document.addEventListener('pointerdown',function(e){
    if(busy||pet.classList.contains('sleep'))return;
    if(e.target.closest('.pet')||e.target.closest('.dock')||e.target.closest('.topbar')||e.target.closest('.tip'))return;
    wake();
    walkTo(e.clientX-wrap.offsetWidth/2, e.clientY-wrap.offsetHeight/2);
  });

  /* ---------- 改名 ---------- */
  nameTag.addEventListener('click',function(){
    var n=prompt('给我的宠物起个名字吧～',state.name);
    if(n&&n.trim()){state.name=n.trim().slice(0,8);nameText.textContent=state.name;save();beep(500,0.1,'sine',0.1);say('我叫'+state.name+'啦～');}
  });

  /* ---------- 按钮 ---------- */
  var acts={feed:actFeed,sleep:actSleep,dance:actDance,talk:actTalk,home:goHome,view:actView,walk:actWalk};
  document.querySelectorAll('.btn').forEach(function(b){
    if(b.dataset.act==='sleep')sleepBtn=b;
    b.addEventListener('click',function(){
      b.classList.add('pop');setTimeout(function(){b.classList.remove('pop');},360);
      acts[b.dataset.act]();
    });
  });

  /* ---------- 提示 & 开场 ---------- */
  setTimeout(function(){tip.classList.add('hide');},9000);
  var first=!localStorage.getItem(KEY);
  if(first){setTimeout(function(){say('你好呀，我是'+state.name+'～ 点地面我可以走过去，连点我会有小情绪哦！',5000);},600);}

  /* ---------- 保存 & 定时器 ---------- */
  window.addEventListener('beforeunload',save);
  setInterval(save,15000);
  scheduleIdle();

  load();
})();
</script>
</body>
</html>
